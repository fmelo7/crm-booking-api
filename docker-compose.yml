x-app-env: &app-env
  env_file:
    - ${APP_ENV_FILE:-.env.local}
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./apps/frontend/public:/usr/share/nginx/html:ro
      - ./apps/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

  api:
    <<: *app-env
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SERVICE_NAME: api-gateway
      PORT: ${PORT:-3000}
      APPOINTMENTS_SERVICE_URL: http://appointments-service:3001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token}
      GATEWAY_AUTH_MODE: ${GATEWAY_AUTH_MODE:-disabled}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
    ports:
      - "3000:3000"
    depends_on:
      appointments-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  appointments-service:
    <<: *app-env
    build:
      context: .
      dockerfile: apps/appointments-service/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SERVICE_NAME: appointments-service
      APPOINTMENTS_SERVICE_PORT: ${APPOINTMENTS_SERVICE_PORT:-3001}
      APPOINTMENTS_MONGODB_URI: ${APPOINTMENTS_MONGODB_URI:-mongodb://host.docker.internal:27017/crm-booking-appointments}
      APPOINTMENTS_POSTGRES_URI: ${APPOINTMENTS_POSTGRES_URI:-postgres://postgres:postgres@host.docker.internal:5432/crm_booking_appointments}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  customers-service:
    <<: *app-env
    build:
      context: .
      dockerfile: apps/customers-service/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SERVICE_NAME: customers-service
      CUSTOMERS_SERVICE_PORT: ${CUSTOMERS_SERVICE_PORT:-3002}
      CUSTOMERS_MONGODB_URI: ${CUSTOMERS_MONGODB_URI:-mongodb://host.docker.internal:27017/crm-booking-customers}
      CUSTOMERS_POSTGRES_URI: ${CUSTOMERS_POSTGRES_URI:-postgres://postgres:postgres@host.docker.internal:5432/crm_booking_customers}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  services-service:
    <<: *app-env
    build:
      context: .
      dockerfile: apps/services-service/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SERVICE_NAME: services-service
      SERVICES_SERVICE_PORT: ${SERVICES_SERVICE_PORT:-3003}
      SERVICES_MONGODB_URI: ${SERVICES_MONGODB_URI:-mongodb://host.docker.internal:27017/crm-booking-services}
      SERVICES_POSTGRES_URI: ${SERVICES_POSTGRES_URI:-postgres://postgres:postgres@host.docker.internal:5432/crm_booking_services}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/api/health').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  professionals-service:
    <<: *app-env
    build:
      context: .
      dockerfile: apps/professionals-service/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SERVICE_NAME: professionals-service
      PROFESSIONALS_SERVICE_PORT: ${PROFESSIONALS_SERVICE_PORT:-3004}
      PROFESSIONALS_MONGODB_URI: ${PROFESSIONALS_MONGODB_URI:-mongodb://host.docker.internal:27017/crm-booking-professionals}
      PROFESSIONALS_POSTGRES_URI: ${PROFESSIONALS_POSTGRES_URI:-postgres://postgres:postgres@host.docker.internal:5432/crm_booking_professionals}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
    ports:
      - "3004:3004"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/api/health').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
