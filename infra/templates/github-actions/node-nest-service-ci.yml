name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate Node/Nest service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test

      - name: Validate contracts
        run: npm run test:contracts --if-present

      - name: Build
        run: npm run build --if-present

      - name: Validate Docker image build
        run: |
          if [ -f Dockerfile ]; then
            docker build .
          fi
